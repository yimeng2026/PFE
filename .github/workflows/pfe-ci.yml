name: PFE Pipeline CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * *'

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Lint Python sources
        # Sage preparser syntax is checked only by the separate Sage job.
        run: |
          flake8 pfe-pipelines/ pfe-agents/ pfe_emergence/ alpha_derivation/verify_simulation_results.py --count --select=E9,F63,F7,F82 --show-source --statistics
      - name: Check maintained regression files with Black
        # This scoped check makes no claim that all historical sources are formatted.
        run: |
          black --check pfe-pipelines/test_pfe_pipeline.py pfe_emergence/test_mass_void_theory.py alpha_derivation/verify_simulation_results.py
      - name: Type check touched core modules
        run: |
          mypy pfe-pipelines/pfe_pipeline.py pfe-pipelines/report_generator.py pfe_emergence/mass_void_theory.py --ignore-missing-imports --follow-imports=skip
      - name: Run PFE regression tests
        run: |
          python -m pytest pfe-pipelines/test_pfe_pipeline.py pfe_emergence/test_mass_void_theory.py -q

  lean-text-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Scan actual Lean input without claiming compilation
        run: |
          cd pfe-pipelines
          python pfe_pipeline.py --sylva-dir ../sylva-release/src --output-dir reports --parse-only
      - name: Upload text-scan reports
        uses: actions/upload-artifact@v4
        with:
          name: lean-text-scan-reports
          path: pfe-pipelines/reports/
          if-no-files-found: error

  stored-numerical-consistency:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check stored arithmetic and reject a corrupted control
        run: python alpha_derivation/verify_simulation_results.py

  sage-verification:
    name: SageMath Verification (manual, real Sage environment)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install SageMath
        run: |
          sudo apt-get update
          sudo apt-get install -y sagemath
      - name: Execute Sage-specific verification
        run: |
          set -o pipefail
          mkdir -p sagemath_verification/reports
          cd sagemath_verification
          sage -python unified_verifier.py | tee reports/sage_verification.log
      - name: Upload Sage execution log
        uses: actions/upload-artifact@v4
        with:
          name: sage-verification-log
          path: sagemath_verification/reports/sage_verification.log
          if-no-files-found: error

  agent-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install agent dependency
        run: pip install requests
      - name: Validate CLI and local initialization without an LLM request
        run: |
          cd pfe-agents
          python zhikong_agent.py --help
          python -c "from zhikong_agent import ZhiKongAgent; agent = ZhiKongAgent(api_key=''); assert agent.tasks == []; print('Local initialization passed; no network health claim')"
